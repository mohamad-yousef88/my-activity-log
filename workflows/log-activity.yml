name: Log private commits to public repo

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'  # كل أسبوع

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate commit log
        run: |
          echo "# 🚀 Activity Log for Auto Reply Facebook" > activity.md
          echo "" >> activity.md
          echo "Last 15 commits from private repository:" >> activity.md
          echo "" >> activity.md
          git log -15 --pretty=format:"- **%s** (%h) by %an on %ad" --date=short >> activity.md
          echo "" >> activity.md
          echo "---" >> activity.md
          echo "Generated automatically by GitHub Action" >> activity.md

      - name: Push to public repo
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/YOUR_USERNAME/my-activity-log.git public-log
          cp activity.md public-log/README.md
          cd public-log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update activity log from private repo [skip ci]"
          git push
